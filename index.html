<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 1 Audio</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:20px;background:#fff}
h1{color:#f28c28;text-align:center}
.item{margin:14px 0}
button{width:100%;padding:14px;font-size:18px;border:none;border-radius:8px;background:#f28c28;color:#fff;cursor:pointer}
button:disabled{background:#ccc}
audio{display:none}
</style>
</head>
<body>
<h1>Dual English 1</h1>
<h2>Lesson 1</h2>

<div class="item"><button onclick="playAudio('conversation.mp3')">🎭 Conversation</button></div>
<div class="item"><button onclick="playAudio('words.mp3')">📝 Words</button></div>
<div class="item"><button onclick="playAudio('structure.mp3')">📖 Structure</button></div>
<div class="item"><button disabled>❓ Quiz</button></div>
<div class="item"><button onclick="playAudio('phonics.mp3')">🔤 Phonics</button></div>

<audio id="player"></audio>

<div class="item">
  <button id="pauseBtn" onclick="togglePause()" disabled>⏸ Pause</button>
</div>

<script>
const p = document.getElementById('player');
const pauseBtn = document.getElementById('pauseBtn');

function playAudio(file){
  p.src = file;
  p.currentTime = 0;
  p.play();
  pauseBtn.disabled = false;
  pauseBtn.textContent = '⏸ Pause';
}

function togglePause(){
  if (p.paused) {
    p.play();
    pauseBtn.textContent = '⏸ Pause';
  } else {
    p.pause();
    pauseBtn.textContent = '▶ Resume';
  }
}

p.addEventListener('ended', function(){
  pauseBtn.disabled = true;
  pauseBtn.textContent = '⏸ Pause';
});
</script>
</body>
</html>
